<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>
body{margin:0;background:#F7F4EF}
a{color:#2F4F6B}a:hover{color:#1E3A52}
</style>
</helmet>
<div style="min-height: 1320px; box-sizing: border-box; background: #F7F4EF; color: #1E1C19; font-family: Inter, system-ui, sans-serif;">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 32px; border-bottom: 1px solid #E4DED4;">
    <div style="display: flex; align-items: center; gap: 36px; flex-wrap: wrap;">
      <div style="font-family: Newsreader, Georgia, serif; font-size: 24px;">journal<span style="color: #2F4F6B;">.</span></div>
      <nav aria-label="Views" style="display: flex; gap: 4px;">
        <a href="Editor.dc.html" style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; color: #615B52; text-decoration: none;">Write</a>
        <a href="Timeline.dc.html" aria-current="page" style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; color: #1E1C19; background: #EFEAE2; text-decoration: none;">Timeline</a>
        <a href="Books.dc.html" style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; color: #615B52; text-decoration: none;">Books</a>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button type="button" aria-label="Search entries" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: #615B52; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
      <a href="Appearance.dc.html" title="Settings" style="height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-radius: 18px; border: 1px solid #E4DED4; font-size: 14px; font-weight: 500; color: #1E1C19; text-decoration: none;"><span style="width: 22px; height: 22px; border-radius: 11px; background: #2F4F6B; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center;">n</span>nash</a>
    </div>
  </header>

  <main style="max-width: 920px; margin: 0 auto; padding: 48px 24px 96px; display: flex; flex-direction: column; gap: 40px;">

    <section style="display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -0.02em;">2026</h1>
          <p style="margin: 0; font-size: 14px; color: #615B52;">142 entries · 61,300 words · 23 places · 48 photos</p>
        </div>
        <div role="group" aria-label="Year" style="display: flex; gap: 4px;">
          <button type="button" aria-label="Previous year" style="width: 40px; height: 40px; border: 1px solid #E4DED4; border-radius: 8px; background: #FFFDF9; color: #1E1C19; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next year" disabled style="width: 40px; height: 40px; border: 1px solid #E4DED4; border-radius: 8px; background: #FFFDF9; color: #B5ADA1; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
        </div>
      </div>

      <div role="img" aria-label="Days written in 2026, by month" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; padding: 20px; background: #FFFDF9; border: 1px solid #E4DED4; border-radius: 12px;">
        <sc-for list="{{strip}}" as="m" hint-placeholder-count="12">
          <div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
            <div style="display: grid; grid-template-columns: repeat(5, 6px); gap: 3px;">
              <sc-for list="{{m.days}}" as="d" hint-placeholder-count="30">
                <span style="width: 6px; height: 6px; border-radius: 3px; background: {{d.bg}};"></span>
              </sc-for>
            </div>
            <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: {{m.labelColor}};">{{m.label}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <sc-for list="{{months}}" as="month" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column;">
        <h2 style="margin: 0 0 8px; padding: 10px 0; position: sticky; top: 0; background: #F7F4EF; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #615B52; display: flex; justify-content: space-between;"><span>{{month.name}}</span><span style="font-weight: 500; letter-spacing: 0; text-transform: none;">{{month.summary}}</span></h2>
        <div style="position: relative; display: flex; flex-direction: column;">
          <div aria-hidden="true" style="position: absolute; left: 87px; top: 8px; bottom: 8px; width: 1px; background: #E4DED4;"></div>
          <sc-for list="{{month.items}}" as="e" hint-placeholder-count="3">
            <sc-if value="{{e.isGap}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-template-columns: 72px 32px minmax(0, 1fr); align-items: center; padding: 6px 0;">
                <span></span>
                <span aria-hidden="true" style="justify-self: center; width: 1px; height: 28px; background: #F7F4EF; border-left: 1px dashed #D6CFC3;"></span>
                <span style="font-family: Newsreader, serif; font-style: italic; font-size: 15px; color: #615B52;">{{e.gapText}}</span>
              </div>
            </sc-if>
            <sc-if value="{{e.isEntry}}" hint-placeholder-val="{{ true }}">
              <div style="display: grid; grid-template-columns: 72px 32px minmax(0, 1fr); align-items: start; padding: 10px 0;">
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-top: 14px;">
                  <span style="font-family: Newsreader, serif; font-size: 30px; line-height: 1;">{{e.day}}</span>
                  <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #615B52;">{{e.weekday}}</span>
                </div>
                <span aria-hidden="true" style="justify-self: center; margin-top: 24px; width: 9px; height: 9px; border-radius: 5px; background: #F7F4EF; border: 2px solid #2F4F6B; box-sizing: border-box;"></span>
                <a href="Editor.dc.html" style="display: flex; gap: 20px; padding: 18px 20px; background: #FFFDF9; border: 1px solid #E4DED4; border-radius: 12px; color: #1E1C19; text-decoration: none;">
                  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
                    <span style="font-family: Newsreader, Georgia, serif; font-size: 23px; line-height: 1.25;">{{e.title}}</span>
                    <span style="font-family: Newsreader, Georgia, serif; font-size: 17px; line-height: 1.55; color: #615B52;">{{e.snippet}}</span>
                    <span style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #615B52; margin-top: 2px;">
                      <span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{e.place}}</span>
                      <span>{{e.time}}</span>
                      <span>{{e.words}}</span>
                    </span>
                  </div>
                  <sc-if value="{{e.hasPhoto}}" hint-placeholder-val="{{ false }}">
                    <div role="img" aria-label="Photo from this entry" style="flex: none; width: 132px; height: 100px; border-radius: 8px; background: #EFEAE2; display: flex; align-items: center; justify-content: center; color: #615B52; position: relative;">
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5L6 20"></path></svg>
                      <span style="position: absolute; right: 6px; bottom: 6px; height: 20px; padding: 0 7px; border-radius: 10px; background: rgba(30,28,25,0.72); color: #F7F4EF; font-size: 11px; font-weight: 500; display: flex; align-items: center;">{{e.photos}}</span>
                    </div>
                  </sc-if>
                </a>
              </div>
            </sc-if>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <a href="Books.dc.html" style="align-self: center; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; border: 1px solid #D6CFC3; border-radius: 8px; background: #FFFDF9; font-size: 14px; font-weight: 500; color: #1E1C19; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"></path><path d="M6 17h13"></path></svg>
      Open the 2026 book
    </a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1320}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const lens = [31,28,31,30,31,30,31,31,30,31,30,31];
    const strip = names.map((label, m) => {
      const days = [];
      for (let d = 1; d <= lens[m]; d++) {
        const future = m > 10 || (m === 10 && d > 11);
        const wrote = !future && ((d * 7 + m * 3) % 5 < 2 || (m === 10 && [6, 9, 11].includes(d)));
        days.push({ bg: future ? '#F1ECE4' : wrote ? '#2F4F6B' : '#E4DED4' });
      }
      return { label, days, labelColor: m > 10 ? '#B5ADA1' : '#615B52' };
    });
    const entry = (o) => ({ isEntry: true, isGap: false, hasPhoto: !!o.photos, ...o });
    const gap = (t) => ({ isGap: true, isEntry: false, gapText: t });
    return {
      strip,
      months: [
        { name: 'November', summary: '3 entries · 1,237 words', items: [
          entry({ day: '11', weekday: 'Tue', title: 'A long walk after the rain', snippet: 'The river was higher than I expected. I stood on the footbridge for a long time, not thinking about anything in particular…', place: 'Clifton, Bristol', time: '21:40', words: '412 words', photos: '1 photo' }),
          entry({ day: '09', weekday: 'Sun', title: 'Sunday, slow', snippet: 'Coffee, the crossword, nothing else. I let the whole morning go by without once looking at the time.', place: 'Home', time: '10:15', words: '180 words', photos: '' }),
          entry({ day: '06', weekday: 'Thu', title: 'Notes from the train', snippet: 'Fields still white with frost at eight. A man across the aisle reading the same book as me, two chapters ahead.', place: 'Reading', time: '08:05', words: '645 words', photos: '2 photos' }),
          gap('A quiet stretch — 9 days')
        ] },
        { name: 'October', summary: '11 entries · 4,980 words', items: [
          entry({ day: '28', weekday: 'Tue', title: 'First frost', snippet: 'The car windows iced over. Scraped them with a library card and felt very resourceful about it.', place: 'Home', time: '07:30', words: '96 words', photos: '' }),
          entry({ day: '21', weekday: 'Tue', title: 'Mum’s birthday', snippet: 'Seventy, and she still beat everyone at cards. We ate outside until it got too cold, wrapped in blankets.', place: 'Totnes, Devon', time: '22:10', words: '820 words', photos: '4 photos' })
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
